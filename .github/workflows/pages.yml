name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "nesearch/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site files
        run: |
          test -f site/index.html
          test -f site/docs.html
          test -f site/assets/css/site.css
          test -f site/assets/js/site.js
          test -f site/assets/css/play.css
          test -f site/assets/play/player.js
          test -f site/assets/play/gem6502.wasm
          test -f site/assets/play/roms/falling.nes

      # The static catalog demo is generated at deploy time. It reuses the same
      # C++ catalog code as the CLI, so the Pages copy can never drift from
      # `nesearch search`. When the network is unavailable the build script
      # falls back to nesearch/data/catalog.snapshot.json.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
      - name: Build nesearch
        run: |
          cmake -S nesearch -B nesearch/build -DCMAKE_BUILD_TYPE=Release
          cmake --build nesearch/build -j"$(nproc)"
          ctest --test-dir nesearch/build --output-on-failure
      - name: Build static catalog demo
        run: bash nesearch/scripts/build-static-site.sh --refresh
      - name: Verify static catalog demo
        run: node nesearch/scripts/test-static-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
