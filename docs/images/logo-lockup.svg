<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="Open6502">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="0.65" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#130b0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#ff4d57" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#ff4d57" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
    <style>
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .cn { font-family: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="500" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="500" rx="34" fill="url(#grid)"/>
  <rect width="1600" height="500" rx="34" fill="url(#glow)"/>
  <rect x="1" y="1" width="1598" height="498" rx="33" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>

  <g transform="translate(46 58) scale(0.375)">
    <!-- embed icon geometry by reference is not available in standalone SVG; draw a simplified mark -->
    <rect width="1024" height="1024" rx="220" fill="#080c12"/>
    <g fill="#d8e2f2" fill-opacity="0.76">
      <rect x="380" y="196" width="12" height="78" rx="6"/><rect x="450" y="196" width="12" height="78" rx="6"/><rect x="520" y="196" width="12" height="78" rx="6"/><rect x="590" y="196" width="12" height="78" rx="6"/><rect x="660" y="196" width="12" height="78" rx="6"/>
      <rect x="380" y="750" width="12" height="78" rx="6"/><rect x="450" y="750" width="12" height="78" rx="6"/><rect x="520" y="750" width="12" height="78" rx="6"/><rect x="590" y="750" width="12" height="78" rx="6"/><rect x="660" y="750" width="12" height="78" rx="6"/>
      <rect x="196" y="380" width="78" height="12" rx="6"/><rect x="196" y="450" width="78" height="12" rx="6"/><rect x="196" y="520" width="78" height="12" rx="6"/><rect x="196" y="590" width="78" height="12" rx="6"/><rect x="196" y="660" width="78" height="12" rx="6"/>
      <rect x="750" y="380" width="78" height="12" rx="6"/><rect x="750" y="450" width="78" height="12" rx="6"/><rect x="750" y="520" width="78" height="12" rx="6"/><rect x="750" y="590" width="78" height="12" rx="6"/><rect x="750" y="660" width="78" height="12" rx="6"/>
    </g>
    <rect x="286" y="264" width="452" height="452" rx="64" fill="#0b1018" stroke="#e9eff9" stroke-width="5"/>
    <rect x="350" y="328" width="324" height="324" rx="28" fill="#101722" stroke="#ff4d57" stroke-width="4"/>
    <text x="512" y="520" text-anchor="middle" class="mono" font-size="104" font-weight="700" fill="#f3f7ff" letter-spacing="2">6502</text>
    <text x="512" y="582" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#ff6b73" letter-spacing="7">OPEN SILICON</text>
  </g>

  <text x="458" y="126" class="mono" font-size="18" font-weight="700" fill="#ff6b73" letter-spacing="4">OPEN SOURCE  ·  6502 / NES SoC</text>
  <text x="454" y="258" class="mono" font-size="112" font-weight="700" fill="#f3f7ff" letter-spacing="-3">OPEN<tspan fill="#ff4d57">6502</tspan></text>
  <text x="458" y="306" class="mono" font-size="19" fill="#8e9aad" letter-spacing="2">FROM EMULATOR TO SILICON</text>
  <text x="458" y="382" class="cn" font-size="31" font-weight="600" fill="#e7edf8">把童年，跑进一颗芯片。</text>
  <text x="458" y="430" class="mono" font-size="16" fill="#6f7b8e">github.com/OneDayOneApp/Open6502</text>

  <rect x="458" y="452" width="1020" height="2" fill="#ffffff" fill-opacity="0.10"/>
  <text x="458" y="474" class="mono" font-size="13" fill="#596577">OPEN6502  /  OPEN SILICON  /  v0.2.0</text>
</svg>
