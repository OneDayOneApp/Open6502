# ld65 configuration for the flat 64 KiB `mos6502-nemu` image.
#
#   $0000-$00FF  zero page (app $00-$EF, runtime $F0-$FF)
#   $0200-$03FF  RAM: .bss / .data (zeroed by crt0)
#   $0400-$FFFF  ROM: code, rodata, vectors (fill $EA)
#
# The ROM area is emitted whole ($FC00 bytes), so mkimage.py only has to
# prepend $0400 zero bytes to get a 65,536-byte image.

MEMORY {
    ZP:  start = $0000, size = $0100, type = rw, define = yes;
    RAM: start = $0200, size = $0200, type = rw, define = yes;
    ROM: start = $0400, size = $FC00, type = ro, file = %O, fill = yes, fillval = $EA;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    BSS:      load = RAM, type = bss, optional = yes;
    DATA:     load = RAM, type = rw,  optional = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro,  optional = yes;
    VECTORS:  load = ROM, type = ro,  offset = $FBFA;   # $FFFA - $0400
}
