# ld65 configuration for the `mos6502-nes` cartridge (NROM-256).
#
#   $0000-$07FF  2 KiB WRAM (zero page, stack, .bss/.data)
#   $8000-$FFFF  PRG: code, rodata, vectors (fill $EA)
#
# The PRG area is emitted whole (32 KiB), so mkimage.py only has to prepend the
# 16-byte iNES header and append CHR.

MEMORY {
    ZP:  start = $0000, size = $0100, type = rw, define = yes;
    RAM: start = $0200, size = $0600, type = rw, define = yes;
    PRG: start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $EA;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    BSS:      load = RAM, type = bss, optional = yes;
    DATA:     load = RAM, type = rw,  optional = yes;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro,  optional = yes;
    VECTORS:  load = PRG, type = ro,  offset = $7FFA;   # $FFFA - $8000
}
