<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="170 170 684 684" role="img" aria-label="Open6502 logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="0.58" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#160b0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#ff4d57" stop-opacity="0.23"/>
      <stop offset="0.55" stop-color="#ff4d57" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ff4d57" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#grid)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#glow)"/>

  <!-- chip pins -->
  <g fill="#d8e2f2" fill-opacity="0.76">
    <rect x="380" y="196" width="12" height="78" rx="6"/>
    <rect x="450" y="196" width="12" height="78" rx="6"/>
    <rect x="520" y="196" width="12" height="78" rx="6"/>
    <rect x="590" y="196" width="12" height="78" rx="6"/>
    <rect x="660" y="196" width="12" height="78" rx="6"/>

    <rect x="380" y="750" width="12" height="78" rx="6"/>
    <rect x="450" y="750" width="12" height="78" rx="6"/>
    <rect x="520" y="750" width="12" height="78" rx="6"/>
    <rect x="590" y="750" width="12" height="78" rx="6"/>
    <rect x="660" y="750" width="12" height="78" rx="6"/>

    <rect x="196" y="380" width="78" height="12" rx="6"/>
    <rect x="196" y="450" width="78" height="12" rx="6"/>
    <rect x="196" y="520" width="78" height="12" rx="6"/>
    <rect x="196" y="590" width="78" height="12" rx="6"/>
    <rect x="196" y="660" width="78" height="12" rx="6"/>

    <rect x="750" y="380" width="78" height="12" rx="6"/>
    <rect x="750" y="450" width="78" height="12" rx="6"/>
    <rect x="750" y="520" width="78" height="12" rx="6"/>
    <rect x="750" y="590" width="78" height="12" rx="6"/>
    <rect x="750" y="660" width="78" height="12" rx="6"/>
  </g>

  <!-- chip body -->
  <rect x="286" y="264" width="452" height="452" rx="64" fill="#070a0f" fill-opacity="0.72" filter="url(#soft)"/>
  <rect x="286" y="264" width="452" height="452" rx="64" fill="#0b1018" stroke="#e9eff9" stroke-width="5"/>
  <rect x="304" y="282" width="416" height="416" rx="50" fill="none" stroke="#2a3445" stroke-width="2"/>

  <!-- die -->
  <rect x="350" y="328" width="324" height="324" rx="28" fill="#101722" stroke="#ff4d57" stroke-width="4"/>
  <path d="M386 398H638M386 512H638M386 626H638" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <path d="M430 356V624M512 356V624M594 356V624" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- orientation notch -->
  <circle cx="334" cy="312" r="11" fill="#070a0f" stroke="#ff6b73" stroke-width="3"/>

  <text x="512" y="520" text-anchor="middle" class="mono" font-size="104" font-weight="700" fill="#f3f7ff" letter-spacing="2">6502</text>
  <text x="512" y="582" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#ff6b73" letter-spacing="7">OPEN SILICON</text>

  <!-- corner accents -->
  <path d="M120 248V158H210" fill="none" stroke="#ff4d57" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M904 776V866H814" fill="none" stroke="#ff4d57" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>

  <rect x="40" y="40" width="944" height="944" rx="190" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
</svg>
